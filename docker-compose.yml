networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_PREFIX}.0/24

services:
  db:
    image: postgres:18-alpine
    container_name: restaurant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app_network:
        ipv4_address: ${NETWORK_PREFIX}.10

  backend:
    build: ./backend
    container_name: restaurant_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      app_network:
        ipv4_address: ${NETWORK_PREFIX}.11

  nginx:
    build: ./frontend
    container_name: restaurant_nginx
    restart: unless-stopped
    expose:
      - "80"
      - "443"
    depends_on:
      - backend
    networks:
      app_network:
        ipv4_address: ${NETWORK_PREFIX}.13

volumes:
  postgres_data:
